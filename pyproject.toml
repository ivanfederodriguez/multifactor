[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multifactor-luis-dqi"
version = "0.1.0"
description = "Shared Luis DQI v2 score generation for PROMETHEUS Base B"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.4.6", "pandas==3.0.3", "pyarrow==24.0.0"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32,<2", "altair>=5,<7", "PyYAML>=6,<7"]

[project.scripts]
luis-dqi = "luis_dqi.cli:main"

[tool.setuptools.packages.find]
include = ["luis_dqi*"]

[tool.setuptools.package-data]
luis_dqi = ["provenance.json"]
